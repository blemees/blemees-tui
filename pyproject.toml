[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blemees-tui"
version = "0.1.0"
description = "Multi-session terminal chat for blemees-agentd (Claude Code + Codex)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "blemees contributors" }]
keywords = ["claude", "claude-code", "codex", "agent", "tui", "textual", "blemees"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
]
dependencies = [
    "blemees-agent>=0.11.0",
    "agent-client-protocol>=0.10",
    "textual>=0.80",
]

[project.scripts]
blemees = "blemees_tui.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "textual-dev>=1.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10",
]

[project.urls]
Homepage = "https://github.com/blemees/blemees-tui"
Repository = "https://github.com/blemees/blemees-tui"
Documentation = "https://github.com/blemees/blemees-tui/tree/main/docs"
Issues = "https://github.com/blemees/blemees-tui/issues"
Changelog = "https://github.com/blemees/blemees-tui/blob/main/CHANGELOG.md"
Spec = "https://github.com/blemees/blemees-tui/blob/main/docs/SPEC.md"

[tool.setuptools.packages.find]
include = ["blemees_tui*"]

[tool.setuptools.package-data]
"blemees_tui.styles" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
